version: "3.8"

services:
  db:
    image: postgres:15
    container_name: movie_recommender_db
    restart: always
    environment:
      POSTGRES_USER: nayan
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: movie_recommender
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
